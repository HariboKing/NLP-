<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfc"/>
      <stop offset="100%" stop-color="#eaf1f4"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dda0a0"/>
      <stop offset="100%" stop-color="#af5c5a"/>
    </linearGradient>
    <style>
      .label { font: 700 30px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #af5c5a; }
      .name { font: 700 58px Georgia, 'Times New Roman', serif; fill: #17303c; }
      .point { font: 400 32px 'Segoe UI', Arial, sans-serif; fill: #17303c; }
      .footer { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: rgba(23,48,60,0.5); }
    </style>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="50" y="50" width="800" height="1100" rx="0" fill="white" opacity="0.96"/>
  <rect x="50" y="50" width="800" height="20" fill="#af5c5a"/>
  <text x="90" y="145" class="label">PRE-NLP</text>
  <text x="90" y="205" class="name">Virginia Satir</text>
  <rect x="150" y="255" width="600" height="430" fill="url(#portrait)"/>
  <circle cx="305" cy="420" r="110" fill="rgba(255,255,255,0.14)"/>
  <circle cx="460" cy="430" r="120" fill="rgba(255,255,255,0.92)"/>
  <ellipse cx="460" cy="620" rx="185" ry="125" fill="rgba(255,255,255,0.92)"/>
  <text x="175" y="635" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="rgba(255,255,255,0.18)">VS</text>
  <circle cx="95" cy="752" r="6" fill="#af5c5a"/><text x="120" y="763" class="point">Gezinstherapie</text>
  <circle cx="95" cy="810" r="6" fill="#af5c5a"/><text x="120" y="821" class="point">Communicatiecategorieen</text>
  <circle cx="95" cy="868" r="6" fill="#af5c5a"/><text x="120" y="879" class="point">Communicatie en relaties</text>
  <circle cx="95" cy="926" r="6" fill="#af5c5a"/><text x="120" y="937" class="point">Familiestamboom</text>
  <line x1="85" y1="1000" x2="815" y2="1000" stroke="rgba(23,48,60,0.15)"/>
  <text x="85" y="1050" class="footer">De geschiedenis van NLP</text>
</svg>